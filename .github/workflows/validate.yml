name: Validate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Count skills and agents
        run: |
          echo "Counting skills and agents..."
          find . -name "SKILL.md" -o -path "*/skills/*.md" | wc -l
          find . -path "*/agents/*.md" | wc -l
          echo "Done."

      - name: Validate SKILL.md frontmatter
        run: |
          echo "Validating SKILL.md files have YAML frontmatter..."
          find . -name "SKILL.md" -o -path "*/skills/*.md" | while read -r file; do
            if [ -f "$file" ]; then
              if ! head -n 1 "$file" | grep -q "^---$"; then
                echo "Error: $file does not start with ---"
                exit 1
              fi
            fi
          done

      - name: Validate agent markdown files are non-empty
        run: |
          echo "Validating agent files..."
          find . -path "*/agents/*.md" | while read -r file; do
            if [ -f "$file" ]; then
              if [ ! -s "$file" ]; then
                echo "Error: Agent file $file is empty"
                exit 1
              fi
            fi
          done

      - name: Run markdownlint
        continue-on-error: true
        run: |
          npm install -g markdownlint-cli
          markdownlint "**/*.md"
