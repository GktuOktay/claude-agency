name: Validate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Count skills and agents
        run: |
          echo "=== Envanter Sayımı ==="
          SKILLS_COUNT=$(find .claude/skills -name "SKILL.md" | wc -l)
          AGENTS_COUNT=$(find .claude/agents -maxdepth 1 -name "*.md" | wc -l)
          echo "Bulunan Skill Sayısı: $SKILLS_COUNT"
          echo "Bulunan Agent Sayısı: $AGENTS_COUNT"
          
          if [ "$SKILLS_COUNT" -eq 0 ]; then
            echo "HATA: Hiç skill bulunamadı!"
            exit 1
          fi
          if [ "$AGENTS_COUNT" -eq 0 ]; then
            echo "HATA: Hiç agent bulunamadı!"
            exit 1
          fi

      - name: Validate SKILL.md frontmatter
        run: |
          echo "=== SKILL.md YAML Frontmatter Doğrulaması ==="
          find .claude/skills -name "SKILL.md" | while read -r file; do
            if [ -f "$file" ]; then
              if ! head -n 1 "$file" | grep -q "^---$"; then
                echo "Hata: $file '---' ile başlamıyor!"
                exit 1
              fi
            fi
          done
          echo "Tüm SKILL.md dosyaları geçerli YAML frontmatter ile başlıyor."

      - name: Validate agent markdown files are non-empty
        run: |
          echo "=== Agent Dosyaları Doğrulaması ==="
          find .claude/agents -maxdepth 1 -name "*.md" | while read -r file; do
            if [ -f "$file" ]; then
              if [ ! -s "$file" ]; then
                echo "Hata: Agent dosyası $file boş!"
                exit 1
              fi
            fi
          done
          echo "Tüm agent dosyaları dolu ve geçerli."
