name: Bug Report
description: File a bug report
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How do you trigger this bug?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened?
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: What environment are you running this in?
      options:
        - Windows
        - macOS
        - Linux
        - Other (Specify in description)
  - type: input
    id: claude_version
    attributes:
      label: Claude Code Version
      description: The version of Claude Code you are using.
  - type: input
    id: target
    attributes:
      label: Skill/Agent name
      description: The name of the specific skill or agent having issues, if applicable.
